<!DOCTYPE html>
<html lang="en" data-root="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews · CampusCanteen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head><body><nav class="top" id="nav"></nav>
<main class="wrap"><h1>Reviews</h1>
<form class="card field" id="f" style="max-width:480px"><label for="d">Dish</label><select id="d"></select>
<label for="r">Rating</label><select id="r"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
<label for="c">Comment</label><input id="c" placeholder="What did you think?"><button class="btn" style="margin-top:14px">Submit review</button></form>
<h2>Recent reviews</h2><div class="grid" id="l"></div>
</main><div id="toast"></div><script src="../js/data.js"></script><script src="../js/app.js"></script><script>subnav("student");
$("#d").innerHTML=MENU.map(m=>`<option>${m.name}</option>`).join("");
const rv=[["Veg Thali",5,"Fresh and filling."],["Chole Bhature",4,"Good, a bit oily."],["Cold Coffee",3,"Too sweet."]];
const dr=()=>$("#l").innerHTML=rv.map(r=>`<div class="card"><b>${r[0]}</b><div class="stars" aria-label="${r[1]} stars">${"★".repeat(r[1])}${"☆".repeat(5-r[1])}</div><p>${r[2]}</p></div>`).join("");dr();
$("#f").onsubmit=e=>{e.preventDefault();rv.unshift([$("#d").value,+$("#r").value,$("#c").value||"No comment"]);dr();e.target.reset();toast("Review submitted")};
</script></body></html>
