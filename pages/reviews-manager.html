<!DOCTYPE html>
<html lang="en" data-root="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review manager · CampusCanteen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head><body><nav class="top" id="nav"></nav>
<main class="wrap"><h1>Review manager</h1>
<p class="muted">Dishes averaging below 3.5 stars are flagged for review.</p><div id="t"></div>
</main><div id="toast"></div><script src="../js/data.js"></script><script src="../js/app.js"></script><script>subnav("admin");
const r=[["Veg Thali",4.7,38],["Chicken Biryani",4.2,25],["Cold Coffee",3.1,19],["Egg Fried Rice",2.9,12],["Samosa (2 pcs)",4.4,51]];
$("#t").innerHTML=`<table><tr><th>Dish</th><th>Average</th><th>Reviews</th><th>Flag</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td><span class="stars">${"★".repeat(Math.round(x[1]))}</span> ${x[1]}</td><td>${x[2]}</td><td>${x[1]<3.5?'<span class="flag">Needs attention</span>':"—"}</td></tr>`).join("")}</table>`;
</script></body></html>
