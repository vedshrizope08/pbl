<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up | MIT Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14313a;
            --page: #f2f5f4;
            --surface: #ffffff;
            --accent: #1f7a6b;
            --accent-dark: #17594e;
            --muted: #5b6b70;
            --border: #d5dddf;
            --error: #c0392b;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: "Manrope", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        .login-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            background: var(--surface);
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 40px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 0.975rem;
            line-height: 1.5;
        }

        .field { margin-bottom: 18px; min-width: 0; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            font: inherit;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder { color: #8a979b; }

        input:hover { border-color: #aebbbe; }

        input:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(31, 122, 107, 0.25);
        }

        /* Validation state (added by JS) */
        input.invalid { border-color: var(--error); }
        input.invalid:focus-visible { box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.2); }

        .error-msg {
            display: block;
            min-height: 0;
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--error);
        }
        .error-msg:empty { display: none; }

        /* Form-level message (success / limit reached) */
        .form-alert {
            display: none;
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .form-alert.show { display: block; }
        .form-alert.success { color: var(--accent-dark); background: #e3f3ef; border: 1px solid #b7dfd5; }
        .form-alert.error { color: var(--error); background: #fbeae8; border: 1px solid #f0c4be; }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        a:focus-visible, button:focus-visible {
            outline: 3px solid rgba(31, 122, 107, 0.4);
            outline-offset: 2px;
        }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover { background: var(--accent-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .help {
            margin: 24px 0 0;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .image-panel {
            position: sticky;
            top: 0;
            align-self: start;
            height: 100vh;
            background: var(--ink);
            overflow: hidden;
        }

        .image-panel img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 860px) {
            .login-page {
                grid-template-columns: 1fr;
                grid-template-rows: 220px auto;
            }
            .image-panel { order: -1; position: relative; height: 220px; }
            .login-panel { padding: 36px 24px 48px; align-items: flex-start; }
            .brand { margin-bottom: 28px; }
        }

        @media (max-width: 420px) {
            .two-col { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>
    <main class="login-page">

        <!-- Left: sign up -->
        <section class="login-panel">
            <div class="login-box">
                <p class="brand">Smart Canteen</p>

                <h1>Create your account</h1>
                <p class="subtitle">Sign up to order food and track your orders.</p>

                <div id="formAlert" class="form-alert" role="alert"></div>

                <form id="signupForm" action="#" method="post" novalidate>
                    <div class="field">
                        <label for="username">Student name</label>
                        <input type="text" id="username" name="username"
                               placeholder="Enter your name" autocomplete="name" required>
                        <span class="error-msg" id="err-username"></span>
                    </div>

                    <div class="two-col">
                        <div class="field">
                            <label for="student_id">Student ID</label>
                            <input type="text" id="student_id" name="student_id"
                                   placeholder="e.g. ADT24SOCB1095"
                                   pattern="ADT[0-9]{2}[A-Z]{2,6}([0-9]{4}|D[0-9]{3})"
                                   maxlength="15"
                                   title="Format: ADT + admission year + department code + 4 characters, e.g. ADT24SOCB1095 (direct second year: ADT24SOCBD095)"
                                   autocomplete="off" required>
                            <span class="error-msg" id="err-student_id"></span>
                        </div>
                        <div class="field">
                            <label for="phone">Phone number</label>
                            <input type="tel" id="phone" name="phone"
                                   placeholder="10 digits" pattern="[0-9]{10}" maxlength="10"
                                   inputmode="numeric" autocomplete="tel" required>
                            <span class="error-msg" id="err-phone"></span>
                        </div>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" autocomplete="email" required>
                        <span class="error-msg" id="err-email"></span>
                    </div>

                    <div class="two-col">
                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password"
                                   placeholder="Min. 8 characters" minlength="8"
                                   autocomplete="new-password" required>
                            <span class="error-msg" id="err-password"></span>
                        </div>
                        <div class="field">
                            <label for="confirm_password">Confirm password</label>
                            <input type="password" id="confirm_password" name="confirm_password"
                                   placeholder="Re-enter password"
                                   autocomplete="new-password" required>
                            <span class="error-msg" id="err-confirm_password"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">Sign up</button>
                </form>

                <p class="help">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </section>

        <!-- Right: image -->
        <section class="image-panel">
            <img src="OIP.jpg" alt="MIT campus">
        </section>

    </main>

    <script>
    (function () {
        "use strict";

        /* ---------- Settings ---------- */
        var STORAGE_KEY = "canteenUsers";   // all users are saved under this key in the browser
        var MAX_USERS   = 1000;             // maximum number of accounts
        var LOGIN_PAGE  = "login.html";     // where to go after a successful sign up
        var ID_PATTERN  = /^ADT[0-9]{2}[A-Z]{2,6}([0-9]{4}|D[0-9]{3})$/;

        /* ---------- Elements ---------- */
        var form      = document.getElementById("signupForm");
        var alertBox  = document.getElementById("formAlert");
        var submitBtn = document.getElementById("submitBtn");
        var fields = {
            username:         document.getElementById("username"),
            student_id:       document.getElementById("student_id"),
            phone:            document.getElementById("phone"),
            email:            document.getElementById("email"),
            password:         document.getElementById("password"),
            confirm_password: document.getElementById("confirm_password")
        };

        /* ---------- Storage helpers ---------- */
        function loadUsers() {
            try {
                var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        /* Hash the password so it is not saved as plain text.
           (Real security needs a server; this is for a front-end demo.) */
        async function hashPassword(text) {
            if (window.crypto && window.crypto.subtle) {
                var bytes = new TextEncoder().encode(text);
                var buf = await window.crypto.subtle.digest("SHA-256", bytes);
                return Array.from(new Uint8Array(buf))
                    .map(function (b) { return b.toString(16).padStart(2, "0"); })
                    .join("");
            }
            return text; // fallback if the browser blocks crypto
        }

        /* ---------- Normalising (so "adt24socb1095" = "ADT24SOCB1095") ---------- */
        function clean(name, value) {
            value = value.trim();
            if (name === "student_id") return value.toUpperCase();
            if (name === "email")      return value.toLowerCase();
            if (name === "phone")      return value.replace(/\D/g, "");
            return value;
        }

        /* ---------- Error display ---------- */
        function setError(name, message) {
            document.getElementById("err-" + name).textContent = message || "";
            fields[name].classList.toggle("invalid", !!message);
        }

        function clearErrors() {
            Object.keys(fields).forEach(function (n) { setError(n, ""); });
        }

        function showAlert(type, message) {
            alertBox.className = "form-alert show " + type;
            alertBox.textContent = message;
        }

        function hideAlert() {
            alertBox.className = "form-alert";
            alertBox.textContent = "";
        }

        /* ---------- Validation ---------- */
        function validate(values, users) {
            var ok = true;
            function fail(name, msg) { setError(name, msg); ok = false; }

            // Name: required. Same names ARE allowed (two students can share a name).
            if (values.username.length < 2) {
                fail("username", "Please enter your name.");
            }

            // Student ID: format + must be unique
            if (!ID_PATTERN.test(values.student_id)) {
                fail("student_id", "Use format like ADT24SOCB1095.");
            } else if (users.some(function (u) { return u.studentId === values.student_id; })) {
                fail("student_id", "This Student ID is already registered.");
            }

            // Phone: 10 digits + must be unique
            if (!/^[0-9]{10}$/.test(values.phone)) {
                fail("phone", "Enter a 10-digit phone number.");
            } else if (users.some(function (u) { return u.phone === values.phone; })) {
                fail("phone", "This phone number is already registered.");
            }

            // Email: valid + must be unique
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
                fail("email", "Enter a valid email address.");
            } else if (users.some(function (u) { return u.email === values.email; })) {
                fail("email", "This email is already registered.");
            }

            // Password
            if (values.password.length < 8) {
                fail("password", "Password must be at least 8 characters.");
            }
            if (values.confirm_password !== values.password) {
                fail("confirm_password", "Passwords do not match.");
            }

            return ok;
        }

        /* ---------- Live feedback while typing ---------- */
        // Phone: allow digits only
        fields.phone.addEventListener("input", function () {
            fields.phone.value = fields.phone.value.replace(/\D/g, "");
        });

        // Student ID: show in capitals
        fields.student_id.addEventListener("input", function () {
            fields.student_id.value = fields.student_id.value.toUpperCase();
        });

        // Clear a field's error as soon as the user edits it
        Object.keys(fields).forEach(function (name) {
            fields[name].addEventListener("input", function () {
                setError(name, "");
                hideAlert();
            });
        });

        // Check uniqueness as soon as the user leaves the field
        ["student_id", "phone", "email"].forEach(function (name) {
            fields[name].addEventListener("blur", function () {
                var value = clean(name, fields[name].value);
                if (!value) return;
                var key = name === "student_id" ? "studentId" : name;
                var taken = loadUsers().some(function (u) { return u[key] === value; });
                if (taken) {
                    var labels = { student_id: "Student ID", phone: "phone number", email: "email" };
                    setError(name, "This " + labels[name] + " is already registered.");
                }
            });
        });

        /* ---------- Submit ---------- */
        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            hideAlert();
            clearErrors();

            var users = loadUsers();

            if (users.length >= MAX_USERS) {
                showAlert("error", "Registration is full (" + MAX_USERS + " users). Please contact the canteen admin.");
                return;
            }

            var values = {
                username:         clean("username", fields.username.value),
                student_id:       clean("student_id", fields.student_id.value),
                phone:            clean("phone", fields.phone.value),
                email:            clean("email", fields.email.value),
                password:         fields.password.value,
                confirm_password: fields.confirm_password.value
            };

            if (!validate(values, users)) {
                var firstBad = form.querySelector(".invalid");
                if (firstBad) firstBad.focus();
                return;
            }

            submitBtn.disabled = true;

            var user = {
                id:           users.length + 1,
                name:         values.username,
                studentId:    values.student_id,
                phone:        values.phone,
                email:        values.email,
                passwordHash: await hashPassword(values.password),
                createdAt:    new Date().toISOString()
            };

            try {
                users.push(user);
                saveUsers(users);
            } catch (e) {
                showAlert("error", "Could not save your account. Browser storage may be full or blocked.");
                submitBtn.disabled = false;
                return;
            }

            form.reset();
            showAlert("success", "Account created! Redirecting to login...");
            setTimeout(function () { window.location.href = LOGIN_PAGE; }, 1500);
        });
    })();
    </script>
</body>
</html>
