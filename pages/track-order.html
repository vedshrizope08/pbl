<!DOCTYPE html>
<html lang="en" data-root="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track order · CampusCanteen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head><body><nav class="top" id="nav"></nav>
<main class="wrap"><h1>Track your order</h1><div id="box"></div></main>
<script src="../js/data.js"></script><script src="../js/app.js"></script>
<script>
let o=null;try{o=JSON.parse(localStorage.getItem("order"))}catch{}
if(!o)$("#box").innerHTML='<p>No active order. <a href="menu.html">Place one from the menu</a>.</p>';
else{
 $("#box").innerHTML=`<div class="two"><div class="ticket"><div>Token</div><div class="no">${o.token}</div><div>Pickup ${o.slot} · ${o.id}</div><canvas id="qr" width="140" height="140" aria-label="Pickup QR code"></canvas></div>
 <div><h2 style="margin-top:0">Status</h2><ul class="steps" id="st"></ul><p class="muted">Show the QR code at the counter to collect.</p></div></div>`;
 // Placeholder QR pattern. Swap for a real QR library (e.g. qrcodejs) using o.id.
 const g=$("#qr").getContext("2d");let h=[...o.id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
 for(let y=0;y<14;y++)for(let x=0;x<14;x++){h=(h*1103515245+12345)>>>0;if(h>>>16&1)g.fillRect(x*10,y*10,10,10)}
 const S=["Order placed","Accepted by kitchen","Preparing","Ready for pickup"];
 // Simulated progress. Replace with Socket.IO "order:update" events.
 const draw=()=>{const i=Math.min(3,Math.floor((Date.now()-o.start)/6000));
  $("#st").innerHTML=S.map((s,k)=>`<li class="${k<i||i===3&&k===3?"done":k===i?"now":""}">${s}</li>`).join("")};
 draw();setInterval(draw,1000);
}
</script></body></html>
