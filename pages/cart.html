<!DOCTYPE html>
<html lang="en" data-root="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart · CampusCanteen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head><body><nav class="top" id="nav"></nav>
<main class="wrap"><h1>Your cart</h1><div id="box"></div></main><div id="toast"></div>
<script src="../js/data.js"></script><script src="../js/app.js"></script>
<script>
function draw(){const c=Cart.get();
 if(!c.length){$("#box").innerHTML='<p>Your cart is empty. <a href="menu.html">Add something from the menu</a>.</p>';return}
 $("#box").innerHTML=`<table><tr><th>Item</th><th>Qty</th><th>Price</th></tr>${c.map(x=>{const m=MENU.find(i=>i.id===x.id);
 return `<tr><td>${m.emoji} ${m.name}</td><td><button class="btn ghost sm" onclick="Cart.set(${x.id},${x.qty-1});draw()" aria-label="Remove one">−</button> ${x.qty}
 <button class="btn ghost sm" onclick="Cart.set(${x.id},${x.qty+1});draw()" aria-label="Add one">+</button></td><td>${rs(m.price*x.qty)}</td></tr>`}).join("")}</table>
 <p style="margin:16px 0"><b>Total ${rs(Cart.total())}</b></p><a class="btn alt" href="checkout.html">Choose pickup slot</a>`}
draw();</script></body></html>
